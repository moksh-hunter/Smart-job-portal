# ========================================
# Profile: dev (H2 In-Memory Database)
# ========================================
spring.datasource.url=jdbc:h2:mem:smart_job_portal;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mail - disable health check in dev (no real SMTP needed)
management.health.mail.enabled=false
spring.mail.host=localhost
spring.mail.port=25
